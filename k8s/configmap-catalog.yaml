apiVersion: v1
kind: ConfigMap
metadata:
  name: app-web-catalog
  namespace: app-web
data:
  apps.json: |
    [
      {
        "id": "xterm",
        "name": "Terminal",
        "description": "Browser-accessible diagnostic terminal running inside an isolated desktop session.",
        "featured": true,
        "categories": ["debug", "utility"],
        "tags": ["shell", "x11"],
        "source": {
          "type": "command",
          "command": "xterm -fa 'DejaVu Sans Mono' -fs 11"
        },
        "launch": {
          "args": "",
          "extractAndRun": false,
          "workingDirectory": "/data/home",
          "healthcheckPath": "/"
        },
        "resources": {
          "cpuCores": 0.5,
          "memoryMb": 512
        },
        "display": {
          "width": 1280,
          "height": 800,
          "depth": 24
        },
        "storage": {
          "mode": "per-client"
        },
        "session": {
          "resume": true
        }
      },
      {
        "id": "xclock",
        "name": "XClock",
        "description": "Smoke-test application for validating the X11/noVNC stack.",
        "categories": ["demo", "utility"],
        "tags": ["smoke-test", "clock"],
        "source": {
          "type": "command",
          "command": "xclock -update 1"
        },
        "launch": {
          "args": "",
          "extractAndRun": false
        },
        "resources": {
          "cpuCores": 0.25,
          "memoryMb": 256
        },
        "display": {
          "width": 1024,
          "height": 768,
          "depth": 24
        },
        "storage": {
          "mode": "ephemeral"
        },
        "session": {
          "resume": false
        }
      },
      {
        "id": "xeyes",
        "name": "XEyes",
        "description": "Simple X11 demo app useful to validate pointer and refresh behaviour.",
        "categories": ["demo"],
        "tags": ["pointer", "x11"],
        "source": {
          "type": "command",
          "command": "xeyes"
        },
        "launch": {
          "args": "",
          "extractAndRun": false
        },
        "resources": {
          "cpuCores": 0.25,
          "memoryMb": 256
        },
        "display": {
          "width": 1024,
          "height": 768,
          "depth": 24
        },
        "storage": {
          "mode": "ephemeral"
        },
        "session": {
          "resume": true
        }
      },
      {
        "id": "lens",
        "name": "Lens Desktop",
        "description": "Kubernetes IDE delivered as an Electron AppImage.",
        "categories": ["devops", "kubernetes"],
        "tags": ["electron", "k8s", "ide"],
        "source": {
          "type": "appimage-url",
          "url": "https://api.k8slens.dev/binaries/Lens-2026.3.251250-latest.x86_64.AppImage",
          "sha256": ""
        },
        "launch": {
          "args": "--no-sandbox --disable-gpu --disable-dev-shm-usage --disable-gpu-sandbox",
          "extractAndRun": true,
          "workingDirectory": "/data/home",
          "healthcheckPath": "/"
        },
        "resources": {
          "cpuCores": 2,
          "memoryMb": 4096
        },
        "display": {
          "width": 1440,
          "height": 900,
          "depth": 24
        },
        "storage": {
          "mode": "per-client"
        },
        "session": {
          "resume": true
        },
        "env": {
          "ELECTRON_DISABLE_SANDBOX": "1",
          "ELECTRON_DISABLE_GPU": "1"
        }
      }
    ]
